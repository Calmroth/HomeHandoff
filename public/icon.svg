<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Home Domain icon -- a rounded square in clay-950, the brand amber rooftop
    arch from the sidebar's brand mark, set against the dark clay background.
    Designed maskable: the meaningful glyph is inside the safe zone (radius
    192 around center) so iOS rounded-square masking and Android adaptive-
    icon shapes don't crop it.

    Note: hex/rgb colors here, NOT oklch(). The browser's manifest icon
    fetcher needs a rasterizable SVG; oklch() in attribute color values
    fails the validator in some Chromium versions and the icon shows up as
    "Download error or resource isn't a valid image" in DevTools. These
    hex values are perceptually close to the design tokens (--clay-950,
    --amber-300 -> --amber-600, --green-500) but committed as static so
    the icon never depends on color-mix() / oklch() support.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e7b87a" />
      <stop offset="100%" stop-color="#bb6428" />
    </linearGradient>
  </defs>
  <!-- Background: deep clay -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1e1815" />
  <!-- Brand mark: arc + dot, scaled into the safe zone (radius 192 around center) -->
  <g transform="translate(256 256)" fill="none" stroke="url(#g)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -128 32 L 0 -88 L 128 32" />
    <path d="M -104 24 L -104 128 L 104 128 L 104 24" />
  </g>
  <!-- The "alive" dot -- mirrors the wifi-pulse dot in the sidebar -->
  <circle cx="256" cy="384" r="14" fill="#5fb56e" />
</svg>
