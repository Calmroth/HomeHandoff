<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Home Domain icon -- a rounded square in clay-950, the brand orange-amber
    rooftop arch from the sidebar's brand mark, set against the dark clay
    background. Designed maskable: the meaningful glyph is inside the safe
    zone (256-pixel circle, centered) so iOS rounded-square masking and
    Android adaptive-icon shapes don't crop it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="oklch(0.85 0.13 70)" />
      <stop offset="100%" stop-color="oklch(0.55 0.18 60)" />
    </linearGradient>
  </defs>
  <!-- Background: deep clay -->
  <rect width="512" height="512" rx="96" ry="96" fill="oklch(0.16 0.012 65)" />
  <!-- Brand mark: arc + dot, scaled into the safe zone (radius 192 around center) -->
  <g transform="translate(256 256)" fill="none" stroke="url(#g)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- House roof + sides simplified to a single sweeping arch -->
    <path d="M -128 32 L 0 -88 L 128 32" />
    <path d="M -104 24 L -104 128 L 104 128 L 104 24" />
  </g>
  <!-- The "alive" dot -- mirrors the wifi-pulse dot in the sidebar -->
  <circle cx="256" cy="384" r="14" fill="oklch(0.7 0.12 145)" />
</svg>
