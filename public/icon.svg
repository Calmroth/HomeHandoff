<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Home Domain app icon.
    Warm clay tile, amber hearth-light house, alive dot.
    Maskable: glyph stays inside the 192px-radius safe zone so iOS and
    Android adaptive masks never crop it.
    Colors are static hex (perceptually matched to the clay/amber tokens):
    manifest image decoding is strict XML plus no oklch(), and note that
    double hyphens are illegal inside XML comments, which is exactly what
    broke the previous version of this file.
  -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#efc189" />
      <stop offset="55%" stop-color="#d99a54" />
      <stop offset="100%" stop-color="#b26327" />
    </linearGradient>
    <radialGradient id="hearth" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0%"  stop-color="#3a2c1f" />
      <stop offset="100%" stop-color="#1e1815" />
    </radialGradient>
  </defs>

  <!-- Tile: deep clay with a faint warm hearth glow low-center -->
  <rect width="512" height="512" rx="112" ry="112" fill="#1e1815" />
  <rect width="512" height="512" rx="112" ry="112" fill="url(#hearth)" />

  <!-- House: open, rounded, drawn like the sidebar brand mark -->
  <g fill="none" stroke="url(#amber)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof arch -->
    <path d="M 122 292 L 256 168 L 390 292" />
    <!-- Walls, open at the roofline so the mark breathes -->
    <path d="M 148 300 L 148 386 L 364 386 L 364 300" />
  </g>

  <!-- Alive dot: the wifi-pulse green from the sidebar, sitting as the hearth -->
  <circle cx="256" cy="343" r="17" fill="#5fb56e" />
</svg>
