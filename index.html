<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1815" />
  <!-- mobile-web-app-capable is the standardised companion to the legacy
       apple-mobile-web-app-capable meta. Chrome warns if only the Apple one
       is present; iOS still needs the Apple version. Keep both. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Home" />
  <title>Home — Home Domain</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100;200;300;400;500&family=JetBrains+Mono:wght@400;500&family=Albert+Sans:wght@100;200;300;400&display=swap" rel="stylesheet" />
  <!--
    External script-only dependencies (Spotify iFrame API and Google Identity
    Services) stay as CDN <script> tags because they expose globals via DOM
    side effects, not ES modules. React/ReactDOM/Babel are gone -- Vite bundles
    them from npm now.
  -->
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="bg-photo"></div>
  <div class="bg-wash"></div>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
